openapi: 3.0.0
info:
  title: OpenAPI definition
  version: v0
  description: An example API
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  /pets:
    get:
      summary: Find pets filtered
      description: Find pets filtered by names
      tags:
        - pet-controller
      operationId: pagePets
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PagePet'
    post:
      tags:
        - pet-controller
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    post:
      tags:
        - pet-controller
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      discriminator:
        propertyName: type
        mapping:
          DOG: "#/components/schemas/Dog"
          CAT: "#/components/schemas/Cat"
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 2
          maxLength: 30
        type:
          type: string
          enum:
            - DOG
            - CAT
            - PONY
          example: "DOG"
        description:
          type: string
          minLength: 10
          maxLength: 100
          pattern: '^\w[\w\s\p{P}]+[\w\s\.]$'
          example: "A cute dog"
      example:
        id: 12
        name: Hachicko
        type: DOG
        category: 2
    Dog:
      allOf:
        - $ref: "#/components/schemas/Pet"
        - type: object
          properties:
            category:
              type: integer
              default: "1"
              example: "1"

    Cat:
      allOf:
        - $ref: "#/components/schemas/Pet"
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PagePet:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        empty:
          type: boolean
        unsorted:
          type: boolean
